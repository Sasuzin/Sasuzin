name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Sasuzin
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c792ea&color_dots=#ebedf0,#e8b4bc,#c1354f,#8a2039,#5c1a29
            dist/github-contribution-grid-snake-dark.svg?color_snake=#c792ea&color_dots=#1a1b27,#3b0f1c,#6b1e33,#97293e,#c1354f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
